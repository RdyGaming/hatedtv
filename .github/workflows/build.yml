name: Build Hated TV

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      channel_test:
        description: "Run the full channel test on this build"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          HATEDTV_PUBLISHED: https://rdygaming.github.io/hatedtv
          HATEDTV_PLUTO_RELAY: https://hatedtv-pluto.hatedgaming.workers.dev
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ inputs.channel_test }}" = "true" ] || [ $((10#$HOUR % 12)) -eq 0 ]; then export RUN_HEALTH=1; fi
          python deploy/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
